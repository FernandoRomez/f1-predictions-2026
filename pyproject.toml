[project]
name = "f1pred"
version = "0.1.0"
description = "Probabilistic Formula 1 race and championship forecasts, validated walk-forward"
requires-python = ">=3.11"
dependencies = ["lightgbm>=4.5", "matplotlib>=3.9", "numpy>=2.0", "pandas>=2.2", "pyarrow>=17", "requests>=2.32", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
f1pred = "f1pred.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1pred = ["config.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
