name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (anti-leakage + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  backtest:
    name: Walk-forward backtest (2025-26 hold-out)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      # data/ no está versionado: descarga los datos de Jolpica y Open-Meteo.
      - name: Backtest
        run: uv run f1pred backtest
